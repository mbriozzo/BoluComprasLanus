<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - BoluCompras Lanus</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2.5rem;
            margin-top: 2rem;
            box-shadow: var(--shadow);
        }

        .product-detail-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            border-radius: var(--radius);
            background: #0a0a0a;
            padding: 10px;
        }

        .product-detail-info h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .product-detail-category {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .product-detail-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 1.5rem 0;
        }

        .product-detail-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .actions-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: var(--text-main);
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-main);
            overflow: hidden;
        }

        .quantity-selector button {
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .quantity-selector span {
            padding: 0 1rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-primary-action {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary-action:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }
            .product-detail-image {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <img src="Logo.jpg" alt="Logo"> BoluCompras Lanus
            </a>
            <button class="cart-btn" id="cartToggleBtn">
                🛒 Carrito (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <a href="index.html" class="btn-back">← Volver al catálogo</a>

        <div id="productDetailContent">
            <!-- Cargado por JS -->
        </div>
    </main>

    <!-- Cart Drawer Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Tu Carrito de Compras</h2>
                <button class="close-cart" id="closeCartBtn">&times;</button>
            </div>
            <div class="cart-items" id="cartItemsContainer">
                <!-- Items del carrito -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotalPrice">$0</span>
                </div>
                <button class="btn-checkout" id="whatsappCheckoutBtn">
                    💬 Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BoluCompras Lanus. Todos los derechos reservados. Creado para ventas directas.</p>
    </footer>

    <!-- Scripts -->
    <script src="products.js"></script>
    <script>
        let cart = [];
        let currentQuantity = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            const product = products.find(p => p.id === productId);
            const container = document.getElementById('productDetailContent');

            if (!product) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem 0;">
                        <h2>Producto no encontrado</h2>
                        <p style="color: var(--text-muted); margin: 1rem 0;">El producto que buscas no existe o fue eliminado.</p>
                        <a href="index.html" class="btn-primary-action" style="text-decoration: none; display: inline-block; margin-top: 1rem;">Volver al inicio</a>
                    </div>
                `;
            } else {
                const catObj = categories.find(c => c.id === product.category);
                const catName = catObj ? catObj.name : product.category;
                
                document.title = `${product.name} - BoluCompras Lanus`;

                container.innerHTML = `
                    <div class="product-detail-container">
                        <img src="${product.image}" alt="${product.name}" class="product-detail-image">
                        <div class="product-detail-info">
                            <span class="product-detail-category">${catName}</span>
                            <h1>${product.name}</h1>
                            <div class="product-detail-price">$${product.price.toLocaleString('es-AR')}</div>
                            <p class="product-detail-desc">${product.description}</p>
                            
                            <div style="margin-bottom: 2rem;">
                                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;">Cantidad:</p>
                                <div class="actions-group">
                                    <div class="quantity-selector">
                                        <button onclick="updateQty(-1)">-</button>
                                        <span id="qtyDisplay">1</span>
                                        <button onclick="updateQty(1)">+</button>
                                    </div>
                                    <button class="btn-primary-action" onclick="addProductToCart(${product.id})">🛒 Agregar al Carrito</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            setupCartModal();
        });

        function updateQty(delta) {
            currentQuantity += delta;
            if (currentQuantity < 1) currentQuantity = 1;
            const display = document.getElementById('qtyDisplay');
            if (display) display.textContent = currentQuantity;
        }

        function addProductToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += currentQuantity;
            } else {
                cart.push({ ...product, quantity: currentQuantity });
            }

            updateCartUI();
            document.getElementById('cartModal').classList.add('open');
        }

        function setupCartModal() {
            const cartToggleBtn = document.getElementById('cartToggleBtn');
            const cartModal = document.getElementById('cartModal');
            const closeCartBtn = document.getElementById('closeCartBtn');
            const whatsappCheckoutBtn = document.getElementById('whatsappCheckoutBtn');

            cartToggleBtn.addEventListener('click', () => cartModal.classList.add('open'));
            closeCartBtn.addEventListener('click', () => cartModal.classList.remove('open'));
            cartModal.addEventListener('click', (e) => {
                if (e.target === cartModal) cartModal.classList.remove('open');
            });
            whatsappCheckoutBtn.addEventListener('click', sendWhatsAppOrder);
        }

        window.removeFromCart = function(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        window.changeQuantity = function(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                updateCartUI();
            }
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = totalCount;

            const cartItemsContainer = document.getElementById('cartItemsContainer');
            cartItemsContainer.innerHTML = '';

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">Tu carrito está vacío.</p>`;
                document.getElementById('cartTotalPrice').textContent = '$0';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>$${item.price.toLocaleString('es-AR')} x ${item.quantity}</p>
                    </div>
                    <div class="cart-item-actions">
                        <button onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)">+</button>
                        <button onclick="removeFromCart(${item.id})" style="color: #ef4444; margin-left: 0.5rem;" title="Eliminar">&times;</button>
                    </div>
                `;
                cartItemsContainer.appendChild(div);
            });

            document.getElementById('cartTotalPrice').textContent = `$${total.toLocaleString('es-AR')}`;
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert('Tu carrito está vacío. Agrega productos antes de enviar el pedido.');
                return;
            }

            let message = '¡Hola! 👋 Me gustaría hacer el siguiente pedido:\n\n';
            let total = 0;

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `${index + 1}. *${item.name}* (Cant: ${item.quantity}) - $${subtotal.toLocaleString('es-AR')}\n`;
            });

            message += `\n*Total a pagar: $${total.toLocaleString('es-AR')}*\n\n¿Podrían confirmarme stock y formas de pago/envío? ¡Gracias!`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
